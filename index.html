<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Budget Calculator</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --dad-blue: #0ea5e9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dad-mode-banner {
            background: rgba(14, 165, 233, 0.15);
            border: 1px solid var(--dad-blue);
            color: #e0f2fe;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            margin-bottom: 24px;
        }

        .bulk-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            color: var(--text-main);
            padding: 14px;
            font-size: 1rem;
            outline: none;
            resize: vertical;
            font-family: inherit;
        }

        .btn {
            font-weight: 600;
            font-size: 1rem;
            padding: 14px 24px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .btn-share {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            color: white;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }
        .btn-share:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-submit-dad {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            display: none;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 15px 0;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 8px;
        }

        .item-list { display: flex; flex-direction: column; gap: 12px; }

        .budget-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 14px 16px;
            border-radius: 10px;
        }

        .dad-toggle label {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--panel-border);
        }

        .dad-toggle input[type="radio"] { display: none; }
        .dad-toggle input[value="approve"]:checked + label { background: var(--accent-success); color: white; }
        .dad-toggle input[value="reject"]:checked + label { background: var(--accent-danger); color: white; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent-success);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.4s ease;
            z-index: 100;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="dad-mode-banner" id="dad-banner">👨‍👦 Dad Review Mode: Check items and click submit at the bottom.</div>
    
    <header>
        <h1 id="app-title">Bulk Budget Calculator</h1>
    </header>

    <div class="card" id="input-card">
        <div class="bulk-container">
            <span style="font-size: 0.85rem; color: var(--text-muted);">Type list below. Press <b>Enter</b> to instantly add a line:</span>
            <textarea id="bulk-input" rows="8" placeholder="MONMrngToCampus 367&#10;Lunch 200&#10;Eveningbackhome 367"></textarea>
        </div>
    </div>

    <div class="card">
        <div class="section-title">
            <span>Calculated Breakdown</span>
            <span style="color: var(--accent-success)">Total: Ksh <span id="total-amount">0.00</span></span>
        </div>
        <div class="item-list" id="item-list"></div>
    </div>

    <div style="margin-top: 20px;">
        <button class="btn btn-share" id="share-btn" onclick="generateShortDadLink()">🔗 Generate Short Link for Dad</button>
        <button class="btn btn-submit-dad" id="dad-submit-btn" onclick="submitDadResponse()">📤 Send Response back to Brian</button>
    </div>
</div>

<div class="toast" id="toast">✓ Short link copied! Send it to Dad.</div>

<script>
    let budgetItems = [];
    let isDadMode = false;

    // YOUR ACTUAL LIVE WEBSITE HOME LINK
    const LIVE_WEBSITE_URL = "https://tiropson5-ai.github.io/Budget/";

    window.addEventListener('DOMContentLoaded', () => {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('b');

            if (dataParam) {
                try {
                    const decodedData = decodeURIComponent(escape(atob(dataParam.replace(/\s/g, ''))));
                    budgetItems = JSON.parse(decodedData);
                    isDadMode = true;
                    
                    document.getElementById('dad-banner').style.display = 'block';
                    document.getElementById('input-card').style.display = 'none';
                    document.getElementById('share-btn').style.display = 'none';
                    document.getElementById('dad-submit-btn').style.display = 'inline-flex';
                    document.getElementById('app-title').textContent = "Review Brian's Budget";
                } catch(err) {
                    console.error("Link parsing error", err);
                }
            } else {
                const cachedRaw = localStorage.getItem('bulkRawTextV8') || "";
                const textarea = document.getElementById('bulk-input');
                if (textarea) {
                    textarea.value = cachedRaw;
                    textarea.addEventListener('keyup', parseBulkInput);
                    if (cachedRaw.trim() !== "") {
                        parseBulkInput();
                    }
                }
            }
        } catch (globalErr) {
            console.error(globalErr);
        }
        updateUI();
    });

    function parseBulkInput() {
        if (isDadMode) return;
        const textarea = document.getElementById('bulk-input');
        if (!textarea) return;

        const rawText = textarea.value;
        localStorage.setItem('bulkRawTextV8', rawText);
        
        const lines = rawText.split('\n');
        budgetItems = [];

        lines.forEach((line, index) => {
            if (line.trim() === '') return;
            const match = line.match(/(.+?)(?:\s*-\s*|\s+)(\d+(?:\.\d+)?)\s*$/);
            if (match) {
                const name = match[1].trim();
                const amount = parseFloat(match[2]);
                if (name && !isNaN(amount)) {
                    budgetItems.push({ id: index, name, amount, status: 'approve' });
                }
            }
        });
        updateUI();
    }

    function updateUI() {
        const listContainer = document.getElementById('item-list');
        const totalAmountDisplay = document.getElementById('total-amount');
        if (!listContainer || !totalAmountDisplay) return;
        
        listContainer.innerHTML = '';
        let total = 0;

        if (budgetItems.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-style:italic;padding:20px;">Type an item with a space and price, then press Enter...</div>';
            totalAmountDisplay.textContent = "0.00";
            return;
        }

        budgetItems.forEach(item => {
            total += item.amount;
            const itemDiv = document.createElement('div');
            itemDiv.className = 'budget-item';
            
            itemDiv.innerHTML = `
                <div class="item-details">
                    <span class="item-title">${item.name}</span>
                </div>
                <div style="display: flex; align-items: center; gap: 14px;">
                    <span style="font-weight:600;">Ksh ${item.amount.toLocaleString('en-KE',{minimumFractionDigits:2})}</span>
                    ${isDadMode ? `
                        <div class="dad-toggle" style="display: flex; gap: 8px;">
                            <input type="radio" id="app-${item.id}" name="status-${item.id}" value="approve" ${item.status === 'approve' ? 'checked' : ''} onchange="updateItemStatus(${item.id}, 'approve')">
                            <label for="app-${item.id}">✔️</label>
                            <input type="radio" id="rej-${item.id}" name="status-${item.id}" value="reject" ${item.status === 'reject' ? 'checked' : ''} onchange="updateItemStatus(${item.id}, 'reject')">
                            <label for="rej-${item.id}">❌</label>
                        </div>
                    ` : ''}
                </div>
            `;
            listContainer.appendChild(itemDiv);
        });

        totalAmountDisplay.textContent = total.toLocaleString('en-KE', {minimumFractionDigits: 2});
    }

    function updateItemStatus(id, newStatus) {
        const item = budgetItems.find(i => i.id === id);
        if (item) item.status = newStatus;
    }

    function generateShortDadLink() {
        if (budgetItems.length === 0) return alert("Type your items first!");
        
        const shareBtn = document.getElementById('share-btn');
        shareBtn.disabled = true;
        shareBtn.textContent = "🔄 Shortening Link...";

        const jsonStr = JSON.stringify(budgetItems);
        const base64Data = btoa(unescape(encodeURIComponent(jsonStr)));
        
        // Forces it to use the live link instead of file:///
        const longUrl = LIVE_WEBSITE_URL + '?b=' + base64Data;

        // Clean TinyURL engine endpoint integration
        const endpoint = 'https://tinyurl.com/api-create.php?url=' + encodeURIComponent(longUrl);

        fetch(endpoint)
            .then(response => {
                if (response.ok) return response.text();
                throw new Error('API down');
            })
            .then(shortUrl => {
                if(shortUrl.startsWith('http')) {
                    copyToClipboard(shortUrl);
                } else {
                    copyToClipboard(longUrl);
                }
            })
            .catch(() => {
                copyToClipboard(longUrl);
            })
            .finally(() => {
                shareBtn.disabled = false;
                shareBtn.textContent = "🔗 Generate Short Link for Dad";
            });
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 3500);
            }
        }).catch(() => {
            alert("Link generated: " + text);
        });
    }

    function submitDadResponse() {
        let textMessage = `Hey Brian, I have reviewed your budget list. Here is my response:\n\n`;
        let approvedTotal = 0;

        budgetItems.forEach(item => {
            const statusSymbol = item.status === 'approve' ? '✅ Approved' : '❌ Declined';
            textMessage += `• ${item.name} (Ksh ${item.amount.toLocaleString('en-KE')}): ${statusSymbol}\n`;
            if (item.status === 'approve') approvedTotal += item.amount;
        });
        textMessage += `\nTotal Approved: Ksh ${approvedTotal.toLocaleString('en-KE', {minimumFractionDigits: 2})}\n\nLove, Dad.`;
        window.open('https://wa.me/?text=' + encodeURIComponent(textMessage), '_blank');
    }
</script>
</body>
</html>

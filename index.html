<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Budget Tracker</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            animation: fadeIn 0.6s ease-out;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1rem;
        }

        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            margin-bottom: 24px;
        }

        /* Input Bar Layout */
        .input-row {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 12px;
        }

        @media (max-width: 480px) {
            .input-row {
                grid-template-columns: 1fr;
            }
        }

        input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            color: var(--text-main);
            padding: 14px 16px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        input::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        /* Buttons */
        .btn {
            font-weight: 600;
            font-size: 1rem;
            padding: 14px 24px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-danger);
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
        }

        .btn-danger:hover {
            background: var(--accent-danger);
            color: white;
        }

        .btn-share {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            color: white;
            width: 100%;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-share:hover {
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }

        /* Data List Display */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .item-list::-webkit-scrollbar {
            width: 6px;
        }
        .item-list::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 10px;
        }

        .budget-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 14px 16px;
            border-radius: 10px;
            animation: slideIn 0.3s ease-out;
        }

        .item-details {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .item-title {
            font-weight: 500;
        }

        .item-cost {
            color: var(--accent-success);
            font-weight: 600;
        }

        /* Bottom Overview Dashboard */
        .summary-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--panel-border);
            padding-top: 20px;
            margin-top: 10px;
        }

        .summary-label {
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .summary-total {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
        }

        /* Feedback Popups */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent-success);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 0;
            font-style: italic;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Weekly Budget</h1>
        <p>Log your expenses and copy a summary for Dad</p>
    </header>

    <!-- Adding Section -->
    <div class="card">
        <div class="input-row">
            <input type="text" id="item-name" placeholder="Expense description..." autocomplete="off">
            <input type="number" id="item-amount" placeholder=" ksh 0.00" min="0" step="0.01">
            <button class="btn btn-primary" onclick="addItem()">Add</button>
        </div>
    </div>

    <!-- Overview List Section -->
    <div class="card">
        <div class="item-list" id="item-list">
            <div class="empty-state" id="empty-state">No items added yet. Your breakdown will show up here.</div>
        </div>

        <div class="summary-box">
            <span class="summary-label">Requested Total</span>
            <span class="summary-total"><span id="total-amount">ksh 0.00</span></span>
        </div>
    </div>

    <!-- Execution CTA -->
    <button class="btn btn-share" onclick="copyBudgetForDad()">
        <span>🚀</span> Copy Format for Dad
    </button>
</div>

<div class="toast" id="toast">✓ Copied text layout to clipboard!</div>

<script>
    let budgetItems = [];

    function addItem() {
        const nameInput = document.getElementById('item-name');
        const amountInput = document.getElementById('item-amount');
        
        const name = nameInput.value.trim();
        const amount = parseFloat(amountInput.value);

        if (name === '' || isNaN(amount) || amount <= 0) {
            return; 
        }

        budgetItems.push({ id: Date.now(), name, amount });
        
        nameInput.value = '';
        amountInput.value = '';
        nameInput.focus();
        
        updateUI();
    }

    function deleteItem(id) {
        budgetItems = budgetItems.filter(item => item.id !== id);
        updateUI();
    }

    function updateUI() {
        const listContainer = document.getElementById('item-list');
        const emptyState = document.getElementById('empty-state');
        const totalDisplay = document.getElementById('total-amount');
        
        const dynamicItems = listContainer.querySelectorAll('.budget-item');
        dynamicItems.forEach(el => el.remove());

        let total = 0;

        if (budgetItems.length === 0) {
            emptyState.style.display = 'block';
        } else {
            emptyState.style.display = 'none';
            
            budgetItems.forEach(item => {
                total += item.amount;
                
                const itemDiv = document.createElement('div');
                itemDiv.className = 'budget-item';
                itemDiv.innerHTML = `
                    <div class="item-details">
                        <span class="item-title">${item.name}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <span class="item-cost">Ksh ${item.amount.toLocaleString('en-KE', {minimumFractionDigits: 2})}</span>
                        <button class="btn btn-danger" onclick="deleteItem(${item.id})">Delete</button>
                    </div>
                `;
                listContainer.appendChild(itemDiv);
            });
        }

        totalDisplay.textContent = total.toLocaleString('en-KE', {minimumFractionDigits: 2});
    }

    function copyBudgetForDad() {
        if (budgetItems.length === 0) {
            return;
        }

        let total = 0;
        let textMessage = `Hey Dad, here is my budget breakdown for this week:\n\n`;
        
        budgetItems.forEach(item => {
            const formattedAmount = item.amount.toLocaleString('en-KE', {minimumFractionDigits: 2});
            textMessage += `• ${item.name}: Ksh ${formattedAmount}\n`;
            total += item.amount;
        });
        
        const formattedTotal = total.toLocaleString('en-KE', {minimumFractionDigits: 2});
        textMessage += `\nTotal: Ksh ${formattedTotal}\n\nThanks!`;

        navigator.clipboard.writeText(textMessage).then(() => {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        });
    }

    document.getElementById('item-amount').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addItem();
    });
</script>

</body>
</html>

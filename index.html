<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Budget Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --reviewer-blue: #0ea5e9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .app-container { width: 100%; max-width: 650px; position: relative; }
        
        header { 
            position: relative;
            text-align: center; 
            margin-bottom: 20px; 
            padding-right: 40px;
        }
        
        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .options-menu-btn {
            position: absolute;
            right: 0;
            top: 5px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 10;
        }
        .options-menu-btn:hover { background: rgba(255, 255, 255, 0.15); }

        .side-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 85%;
            max-width: 400px;
            height: 100%;
            background: #0f132a;
            border-left: 1px solid var(--panel-border);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            z-index: 200;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .side-drawer.open { right: 0; }

        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 199;
            display: none;
        }
        .drawer-overlay.show { display: block; }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .drawer-title { font-size: 1.2rem; font-weight: 700; color: #fff; }
        .close-drawer-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .history-scroll-container {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .reviewer-mode-banner {
            background: rgba(14, 165, 233, 0.15);
            border: 1px solid var(--reviewer-blue);
            color: #e0f2fe;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            margin-bottom: 24px;
        }

        .bulk-container { display: flex; flex-direction: column; gap: 12px; }

        textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            color: var(--text-main);
            padding: 14px;
            font-size: 1rem;
            outline: none;
            resize: vertical;
            font-family: inherit;
            box-sizing: border-box;
        }

        .btn {
            font-weight: 600;
            font-size: 1rem;
            padding: 14px 24px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .btn-share {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            color: white;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }
        .btn-share:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }

        .btn-submit-review {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            display: none;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 15px 0;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 8px;
        }

        .item-list { display: flex; flex-direction: column; gap: 12px; }

        .budget-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 14px 16px;
            border-radius: 10px;
        }

        .review-toggle label {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--panel-border);
        }

        .review-toggle input[type="radio"] { display: none; }
        .review-toggle input[value="approve"]:checked + label { background: var(--accent-success); color: white; }
        .review-toggle input[value="reject"]:checked + label { background: var(--accent-danger); color: white; }

        .history-card-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .history-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .history-summary {
            font-size: 0.95rem;
            font-weight: 600;
            color: #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-inline-delete {
            background: none;
            border: none;
            color: var(--accent-danger);
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
            opacity: 0.6;
        }
        .btn-inline-delete:hover { opacity: 1; }
        
        .btn-clear-history {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--accent-danger);
            color: #fca5a5;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-clear-history:hover { background: var(--accent-danger); color: white; }

        .drawer-nav-link {
            display: block;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 15px;
            font-size: 0.95rem;
        }
        .drawer-nav-link:hover { background: rgba(56, 189, 248, 0.2); }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent-success);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.4s ease;
            z-index: 300;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer(false)"></div>
<div class="side-drawer" id="side-drawer">
    <div class="drawer-header">
        <span class="drawer-title">⚙️ Options & History</span>
        <button class="close-drawer-btn" onclick="toggleDrawer(false)">✕</button>
    </div>
    
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <span style="font-size:0.9rem; font-weight:700; color:var(--text-muted);">Stored Calculations</span>
        <button class="btn-clear-history" id="clear-history-btn" onclick="clearAllLocalHistory()" style="display:none;">Clear All</button>
    </div>

    <div class="history-scroll-container" id="local-history-target">
        <div style="text-align:center;color:var(--text-muted);font-style:italic;font-size:0.85rem;padding:20px 0;">No logs cached locally on this phone yet.</div>
    </div>

    <a href="logs.html" class="drawer-nav-link">📋 View Response Logs →</a>
</div>

<div class="app-container">
    <div class="reviewer-mode-banner" id="reviewer-banner">📝 Reviewer Mode: Approve or reject items below and save decisions.</div>
    
    <header>
        <h1 id="app-title">Bulk Budget Calculator</h1>
        <button class="options-menu-btn" id="options-btn" onclick="toggleDrawer(true)" title="Open Options">⋮</button>
    </header>

    <div class="card" id="input-card">
        <div class="bulk-container">
            <span style="font-size: 0.85rem; color: var(--text-muted);">Type list or paste text layout response below:</span>
            <textarea id="bulk-input" rows="8" placeholder="MONMrngToCampus 367&#10;Lunch 200&#10;Eveningbackhome 367"></textarea>
        </div>
    </div>

    <div class="card">
        <div class="section-title">
            <span>Calculated Breakdown</span>
            <span style="color: var(--accent-success)">Total: Ksh <span id="total-amount">0.00</span></span>
        </div>
        <div class="item-list" id="item-list"></div>
    </div>

    <div style="margin-top: 20px;">
        <button class="btn btn-share" id="share-btn" onclick="uploadAndCreateShortLink()">Generate Link</button>
        <button class="btn btn-submit-review" id="review-submit-btn" onclick="saveReviewToDb()">💾 Save Review Decisions</button>
    </div>
</div>

<div class="toast" id="toast">✓ Link Copied!</div>

<script>
    const SUPABASE_URL = "https://mvbhmhqibwmsudztnemc.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_rwbT71fupdTCdDUeZG5Jwg_LZafKkfc";
    
    let supabaseClient;
    let budgetItems = [];
    let isReviewerMode = false;
    let databaseRowId = null;
    let currentCalculatedTotal = 0;

    window.addEventListener('DOMContentLoaded', async () => {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const urlParams = new URLSearchParams(window.location.search);
        databaseRowId = urlParams.get('id');

        if (databaseRowId) {
            isReviewerMode = true;
            document.getElementById('reviewer-banner').style.display = 'block';
            document.getElementById('input-card').style.display = 'none';
            document.getElementById('share-btn').style.display = 'none';
            document.getElementById('options-btn').style.display = 'none';
            document.getElementById('review-submit-btn').style.display = 'inline-flex';
            document.getElementById('app-title').textContent = "Review Budget";
            
            await fetchBudgetRecordFromDb(databaseRowId);
        } else {
            renderLocalHistory();

            const cachedRaw = localStorage.getItem('bulkRawTextV11') || "";
            const textarea = document.getElementById('bulk-input');
            if (textarea) {
                textarea.value = cachedRaw;
                textarea.addEventListener('keyup', parseBulkInput);
                if (cachedRaw.trim() !== "") parseBulkInput();
            }
        }
    });

    // Toggle panel drawer drawer
    function toggleDrawer(open) {
        const drawer = document.getElementById('side-drawer');
        const overlay = document.getElementById('drawer-overlay');
        if (open) {
            drawer.classList.add('open');
            overlay.classList.add('show');
        } else {
            drawer.classList.remove('open');
            overlay.classList.remove('show');
        }
    }

    function parseBulkInput() {
        if (isReviewerMode) return;
        const textarea = document.getElementById('bulk-input');
        if (!textarea) return;

        const rawText = textarea.value;
        localStorage.setItem('bulkRawTextV11', rawText);
        
        const lines = rawText.split('\n');
        budgetItems = [];

        lines.forEach((line, index) => {
            const cleanLine = line.trim();
            if (cleanLine === '' || cleanLine.toLowerCase().includes('total approved:')) return;

            if (cleanLine.includes('Ksh') || cleanLine.includes('ksh')) {
                let name = cleanLine.replace(/[•\-\*]/g, '').split('(Ksh')[0].split('(ksh')[0].trim();
                
                let amountMatch = cleanLine.match(/(?:Ksh|ksh)\s*([\d,.]+)/);
                let amount = amountMatch ? parseFloat(amountMatch[1].replace(/,/g, '')) : 0;
                
                let isRejected = cleanLine.includes('❌') || cleanLine.toLowerCase().includes('declined');
                let status = isRejected ? 'reject' : 'approve';

                if (name && !isNaN(amount) && amount > 0) {
                    budgetItems.push({ id: index, name, amount, status });
                }
            } 
            else {
                const match = cleanLine.match(/(.+?)(?:\s*-\s*|\s+)(\d+(?:\.\d+)?)\s*$/);
                if (match) {
                    const name = match[1].trim();
                    const amount = parseFloat(match[2]);
                    if (name && !isNaN(amount)) {
                        budgetItems.push({ id: index, name, amount, status: 'approve' });
                    }
                }
            }
        });
        updateUI();
    }

    function updateUI() {
        const listContainer = document.getElementById('item-list');
        const totalAmountDisplay = document.getElementById('total-amount');
        if (!listContainer || !totalAmountDisplay) return;
        
        listContainer.innerHTML = '';
        currentCalculatedTotal = 0;

        if (budgetItems.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-style:italic;padding:20px;">Type list items or paste text here...</div>';
            totalAmountDisplay.textContent = "0.00";
            return;
        }

        budgetItems.forEach(item => {
            if (!isReviewerMode || item.status === 'approve') currentCalculatedTotal += item.amount;
            
            const itemDiv = document.createElement('div');
            itemDiv.className = 'budget-item';
            itemDiv.innerHTML = `
                <div><span>${item.name}</span></div>
                <div style="display: flex; align-items: center; gap: 14px;">
                    <span style="font-weight:600; color:${item.status==='reject'?'var(--accent-danger)':'white'}">Ksh ${item.amount.toLocaleString('en-KE')}</span>
                    ${isReviewerMode ? `
                        <div class="review-toggle">
                            <input type="radio" id="app-${item.id}" name="status-${item.id}" value="approve" ${item.status === 'approve' ? 'checked' : ''} onchange="updateItemStatus(${item.id}, 'approve')">
                            <label for="app-${item.id}">✔️</label>
                            <input type="radio" id="rej-${item.id}" name="status-${item.id}" value="reject" ${item.status === 'reject' ? 'checked' : ''} onchange="updateItemStatus(${item.id}, 'reject')">
                            <label for="rej-${item.id}">❌</label>
                        </div>
                    ` : ''}
                </div>
            `;
            listContainer.appendChild(itemDiv);
        });

        totalAmountDisplay.textContent = currentCalculatedTotal.toLocaleString('en-KE', {minimumFractionDigits: 2});
    }

    function saveCalculationToPhoneMemory(itemsCount, totalAmount) {
        if (itemsCount === 0) return;
        
        let localHistory = JSON.parse(localStorage.getItem('phoneCalculationsHistory') || '[]');
        
        const timestamp = new Date();
        const timeStr = timestamp.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const dateStr = timestamp.toLocaleDateString([], {month: 'short', day: 'numeric'});

        const newLog = {
            id: Date.now().toString(),
            date: `${dateStr} at ${timeStr}`,
            itemsCount: itemsCount,
            total: totalAmount,
            rawTextBackup: document.getElementById('bulk-input').value
        };

        localHistory.unshift(newLog);
        localStorage.setItem('phoneCalculationsHistory', JSON.stringify(localHistory));
        renderLocalHistory();
    }

    function renderLocalHistory() {
        if (isReviewerMode) return;
        const target = document.getElementById('local-history-target');
        const clearBtn = document.getElementById('clear-history-btn');
        let localHistory = JSON.parse(localStorage.getItem('phoneCalculationsHistory') || '[]');

        if (localHistory.length === 0) {
            target.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-style:italic;font-size:0.85rem;padding:30px 0;">No calculation logs cached on this device yet.</div>';
            clearBtn.style.display = 'none';
            return;
        }

        clearBtn.style.display = 'inline-block';
        target.innerHTML = '';

        localHistory.forEach(log => {
            const row = document.createElement('div');
            row.className = 'history-card-item';
            row.innerHTML = `
                <div class="history-card-header">
                    <span>📅 ${log.date}</span>
                    <button class="btn-inline-delete" onclick="event.stopPropagation(); deleteLocalHistoryItem('${log.id}')">🗑️</button>
                </div>
                <div class="history-summary" style="cursor:pointer;" onclick="reloadSavedText('${encodeURIComponent(log.rawTextBackup)}')">
                    <span style="font-size:0.8rem;font-weight:normal;color:var(--text-muted);">${log.itemsCount} lines parsed</span>
                    <span style="color:#a5b4fc;">Ksh ${parseFloat(log.total).toLocaleString('en-KE')} ⚡</span>
                </div>
            `;
            target.appendChild(row);
        });
    }

    function reloadSavedText(encodedText) {
        const decoded = decodeURIComponent(encodedText);
        const textarea = document.getElementById('bulk-input');
        if(textarea) {
            textarea.value = decoded;
            parseBulkInput();
            toggleDrawer(false);
            showToast("📋 Loaded history entry!");
        }
    }

    function deleteLocalHistoryItem(id) {
        let localHistory = JSON.parse(localStorage.getItem('phoneCalculationsHistory') || '[]');
        localHistory = localHistory.filter(item => item.id !== id);
        localStorage.setItem('phoneCalculationsHistory', JSON.stringify(localHistory));
        renderLocalHistory();
    }

    function clearAllLocalHistory() {
        if(confirm("Wipe out all stored phone history calculations?")) {
            localStorage.setItem('phoneCalculationsHistory', '[]');
            renderLocalHistory();
        }
    }

    function updateItemStatus(id, newStatus) {
        const item = budgetItems.find(i => i.id === id);
        if (item) item.status = newStatus;
        updateUI();
    }

    async function uploadAndCreateShortLink() {
        if (budgetItems.length === 0) return alert("Write items first!");
        
        saveCalculationToPhoneMemory(budgetItems.length, currentCalculatedTotal);

        const shareBtn = document.getElementById('share-btn');
        shareBtn.disabled = true;
        shareBtn.textContent = "💾 Cloud uploading...";

        const rawListText = document.getElementById('bulk-input').value;

        const { data, error } = await supabaseClient
            .from('budgets')
            .insert([{ raw_list: rawListText, items: budgetItems }])
            .select();

        if (error || !data) {
            alert("Database Connection Error. Please verify Table Policies.");
            shareBtn.disabled = false;
            return;
        }

        const currentCleanBaseUrl = window.location.href.split('?')[0].split('#')[0];
        const longUrl = currentCleanBaseUrl + '?id=' + data[0].id;
        
        fetch('https://tinyurl.com/api-create.php?url=' + encodeURIComponent(longUrl))
            .then(res => res.ok ? res.text() : longUrl)
            .then(shortUrl => {
                navigator.clipboard.writeText(shortUrl);
                showToast("✓ Link copied!");
            })
            .catch(() => {
                navigator.clipboard.writeText(longUrl);
                showToast("✓ Link copied!");
            })
            .finally(() => {
                shareBtn.disabled = false;
                shareBtn.textContent = "Generate Link";
                
                document.getElementById('bulk-input').value = "";
                localStorage.removeItem('bulkRawTextV11');
                parseBulkInput();
            });
    }

    // Generalized decision logging handler
    async function saveReviewToDb() {
        const reviewBtn = document.getElementById('review-submit-btn');
        reviewBtn.disabled = true;
        reviewBtn.textContent = "⌛ Saving decisions...";

        let approvedTotal = 0;
        budgetItems.forEach(item => {
            if (item.status === 'approve') approvedTotal += item.amount;
        });

        const { error } = await supabaseClient
            .from('budgets')
            .update({ 
                items: budgetItems, 
                dad_approved_total: approvedTotal, 
                is_reviewed: true,
                dad_reviewed_at: new Date().toISOString()
            })
            .eq('id', databaseRowId);

        if (error) {
            alert("Database write connection dropped.");
            reviewBtn.disabled = false;
        } else {
            alert("👍 Decisions recorded!");
            reviewBtn.textContent = "Saved to Database!";
        }
    }

    async function fetchBudgetRecordFromDb(id) {
        const { data, error } = await supabaseClient.from('budgets').select('*').eq('id', id).single();
        if (!error && data) {
            budgetItems = data.items;
            updateUI();
        }
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        if (toast) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }
    }
</script>
</body>
</html>

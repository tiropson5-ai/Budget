<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Budget Tracker & History</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            animation: fadeIn 0.6s ease-out;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1rem;
        }

        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            margin-bottom: 24px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 12px;
        }

        @media (max-width: 480px) {
            .input-row {
                grid-template-columns: 1fr;
            }
        }

        input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            color: var(--text-main);
            padding: 14px 16px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        input::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .btn {
            font-weight: 600;
            font-size: 1rem;
            padding: 14px 24px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-danger);
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .btn-danger:hover {
            background: var(--accent-danger);
            color: white;
        }

        .btn-share {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            color: white;
            width: 100%;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            margin-bottom: 35px;
        }

        .btn-share:hover {
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }

        /* History & Sections Styling */
        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 15px 0;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 8px;
        }

        .section-total {
            color: var(--accent-success);
            font-size: 1.1rem;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .budget-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 12px 16px;
            border-radius: 10px;
        }

        .item-title {
            font-weight: 500;
        }

        .item-cost {
            color: var(--text-main);
            font-weight: 600;
            margin-right: 10px;
        }

        .history-header {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 40px 0 15px 0;
            color: #a5b4fc;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent-success);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Weekly Budget & History</h1>
        <p>Track your daily logs and look back at previous totals</p>
    </header>

    <div class="card">
        <div class="input-row">
            <input type="text" id="item-name" placeholder="Expense description..." autocomplete="off">
            <input type="number" id="item-amount" placeholder="Ksh 0.00" min="0" step="0.01">
            <button class="btn btn-primary" onclick="addItem()">Add</button>
        </div>
    </div>

    <div class="card">
        <div class="section-title">
            <span>Today's List</span>
            <span class="section-total">Total: Ksh <span id="today-total">0.00</span></span>
        </div>
        <div class="item-list" id="today-list">
            <div class="empty-state" id="today-empty">Nothing logged yet today.</div>
        </div>
        
        <button class="btn btn-share" onclick="copyBudgetForDad()">
            <span>🚀</span> Copy Today's Layout for Dad
        </button>
    </div>

    <div class="history-header">Past Days Log</div>
    <div id="history-container">
        </div>
</div>

<div class="toast" id="toast">✓ Copied text layout to clipboard!</div>

<script>
    // Load existing items or start empty
    let budgetItems = JSON.parse(localStorage.getItem('weeklyBudgetWithDates')) || [];

    // Initialize UI on load
    updateUI();

    // Utility function to get clean date string format (YYYY-MM-DD)
    function getLocalDateString(timestamp) {
        const date = timestamp ? new Date(timestamp) : new Date();
        const offset = date.getTimezoneOffset();
        const localizedDate = new Date(date.getTime() - (offset * 60 * 1000));
        return localizedDate.toISOString().split('T')[0];
    }

    // Human-friendly date translations

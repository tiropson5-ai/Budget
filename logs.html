<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dad's Budget Approvals Archive</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #0f1123 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }

        .app-container { width: 100%; max-width: 700px; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #38bdf8, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            flex-grow: 1;
        }

        .action-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .btn-clear-all {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--accent-danger);
            color: #fca5a5;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            display: none; /* Shown dynamically if logs exist */
            transition: all 0.2s ease;
        }
        .btn-clear-all:hover {
            background: var(--accent-danger);
            color: white;
        }

        .archive-card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            margin-bottom: 20px;
            position: relative;
        }

        .archive-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 12px;
            margin-bottom: 14px;
            gap: 10px;
        }

        .header-meta {
            display: flex;
            flex-direction: column;
        }

        .right-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .total-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-success);
            color: #34d399;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-danger);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-delete:hover {
            background: var(--accent-danger);
            color: white;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }

        .status-approved { color: var(--accent-success); font-weight: bold; }
        .status-declined { color: var(--accent-danger); font-weight: bold; text-decoration: line-through; opacity: 0.6; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>📋 Saved Approvals History</h1>
        <div class="action-group">
            <button id="clear-all-btn" class="btn-clear-all" onclick="clearAllRecords()">💥 Clear All History</button>
            <a href="index.html" class="nav-btn">⬅️ Back to Calculator</a>
        </div>
    </header>

    <div id="archive-target">
        <div style="text-align: center; color: var(--text-muted); font-style: italic; padding: 40px;">
            Loading records directly from database...
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://mvbhmhqibwmsudztnemc.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_rwbT71fupdTCdDUeZG5Jwg_LZafKkfc";
    let supabaseClient;

    window.addEventListener('DOMContentLoaded', async () => {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        fetchRecords();
    });

    async function fetchRecords() {
        const target = document.getElementById('archive-target');
        const clearAllBtn = document.getElementById('clear-all-btn');
        target.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-style: italic; padding: 40px;">Refreshing archive logs...</div>';

        const { data, error } = await supabaseClient
            .from('budgets')
            .select('*')
            .eq('is_reviewed', true)
            .order('dad_reviewed_at', { ascending: false });

        if (error || !data || data.length === 0) {
            target.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px;">No saved budget responses found inside the cloud database.</div>';
            clearAllBtn.style.display = 'none';
            return;
        }

        // Show the Clear All button only if records exist
        clearAllBtn.style.display = 'inline-block';
        target.innerHTML = '';
        
        data.forEach(row => {
            let dateObj = new Date(row.dad_reviewed_at);
            let timeStr = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            let dateStr = dateObj.toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});

            const card = document.createElement('div');
            card.className = 'archive-card';
            
            let itemsHtml = row.items.map(item => `
                <div class="item-row">
                    <span style="${item.status === 'reject' ? 'opacity: 0.5;' : ''}">${item.name}</span>
                    <span class="${item.status === 'approve' ? 'status-approved' : 'status-declined'}">
                        Ksh ${item.amount.toLocaleString()} ${item.status === 'approve' ? '✅' : '❌'}
                    </span>
                </div>
            `).join('');

            card.innerHTML = `
                <div class="archive-header">
                    <div class="header-meta">
                        <div style="font-weight: 700; font-size: 1.1rem;">📅 ${dateStr}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">Saved at ${timeStr}</div>
                    </div>
                    <div class="right-controls">
                        <div class="total-badge">Approved: Ksh ${parseFloat(row.dad_approved_total).toLocaleString()}</div>
                        <button class="btn-delete" onclick="deleteRecord('${row.id}')" title="Delete this entry">🗑️</button>
                    </div>
                </div>
                <div>${itemsHtml}</div>
            `;
            target.appendChild(card);
        });
    }

    async function deleteRecord(id) {
        if (!confirm("Are you sure you want to delete this specific review response?")) return;

        const { error } = await supabaseClient
            .from('budgets')
            .delete()
            .eq('id', id);

        if (error) {
            alert("Database Error: Could not delete record.");
        } else {
            fetchRecords();
        }
    }

    async function clearAllRecords() {
        const doubleCheck = confirm("🚨 WARNING:\n\nYou are about to permanently delete ALL history logs inside the database.\n\nThis action cannot be undone. Do you want to proceed?");
        if (!doubleCheck) return;

        const finalCheck = confirm("Confirming once more: completely clear out everything?");
        if (!finalCheck) return;

        // Deletes all rows that have been reviewed
        const { error } = await supabaseClient
            .from('budgets')
            .delete()
            .eq('is_reviewed', true);

        if (error) {
            alert("Database Error: Could not clear all records.");
        } else {
            alert("💥 All history logs cleared successfully!");
            fetchRecords();
        }
    }
</script>
</body>
</html>

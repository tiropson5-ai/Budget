<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dad's Budget Approvals Archive</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #0f1123 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --accent-primary: #6366f1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }

        .app-container { width: 100%; max-width: 700px; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #38bdf8, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            flex-grow: 1;
        }

        .action-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .btn-clear-all {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--accent-danger);
            color: #fca5a5;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .btn-clear-all:hover { background: var(--accent-danger); color: white; }

        /* Parsing Input Section Card */
        .parser-card {
            background: rgba(99, 102, 241, 0.06);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .parser-title {
            font-size: 1rem;
            font-weight: 700;
            color: #a5b4fc;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .parser-textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            color: var(--text-main);
            padding: 12px;
            font-size: 0.9rem;
            outline: none;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
        }
        .parser-btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: opacity 0.2s;
        }
        .parser-btn:hover { opacity: 0.9; }

        .archive-card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            margin-bottom: 20px;
        }

        .archive-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 12px;
            margin-bottom: 14px;
            gap: 10px;
        }

        .header-meta { display: flex; flex-direction: column; }

        .right-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .total-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-success);
            color: #34d399;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-danger);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .btn-delete:hover { background: var(--accent-danger); color: white; }

        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }

        .status-approved { color: var(--accent-success); font-weight: bold; }
        .status-declined { color: var(--accent-danger); font-weight: bold; text-decoration: line-through; opacity: 0.6; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>📋 Saved Approvals History</h1>
        <div class="action-group">
            <button id="clear-all-btn" class="btn-clear-all" style="display:none;" onclick="clearAllRecords()">💥 Clear All History</button>
            <a href="index.html" class="nav-btn">⬅️ Back to Calculator</a>
        </div>
    </header>

    <div class="parser-card">
        <div class="parser-title">✨ Paste Messy Text Response from Dad</div>
        <textarea id="messy-input" class="parser-textarea" rows="4" placeholder="Paste the WhatsApp text message here..."></textarea>
        <button class="parser-btn" onclick="parseTextAndSave()">⚡ Clean & Save to Dashboard History</button>
    </div>

    <div id="archive-target">
        <div style="text-align: center; color: var(--text-muted); font-style: italic; padding: 40px;">
            Loading records directly from database...
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://mvbhmhqibwmsudztnemc.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_rwbT71fupdTCdDUeZG5Jwg_LZafKkfc";
    let supabaseClient;

    window.addEventListener('DOMContentLoaded', async () => {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        fetchRecords();
    });

    async function fetchRecords() {
        const target = document.getElementById('archive-target');
        const clearAllBtn = document.getElementById('clear-all-btn');
        
        const { data, error } = await supabaseClient
            .from('budgets')
            .select('*')
            .eq('is_reviewed', true)
            .order('dad_reviewed_at', { ascending: false });

        if (error || !data || data.length === 0) {
            target.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px;">No saved budget responses found inside the cloud database.</div>';
            clearAllBtn.style.display = 'none';
            return;
        }

        clearAllBtn.style.display = 'inline-block';
        target.innerHTML = '';
        
        data.forEach(row => {
            let dateObj = new Date(row.dad_reviewed_at);
            let timeStr = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            let dateStr = dateObj.toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});

            const card = document.createElement('div');
            card.className = 'archive-card';
            
            let itemsHtml = row.items.map(item => `
                <div class="item-row">
                    <span style="${item.status === 'reject' ? 'opacity: 0.5;' : ''}">${item.name}</span>
                    <span class="${item.status === 'approve' ? 'status-approved' : 'status-declined'}">
                        Ksh ${item.amount.toLocaleString()} ${item.status === 'approve' ? '✅' : '❌'}
                    </span>
                </div>
            `).join('');

            card.innerHTML = `
                <div class="archive-header">
                    <div class="header-meta">
                        <div style="font-weight: 700; font-size: 1.1rem;">📅 ${dateStr}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">Saved at ${timeStr}</div>
                    </div>
                    <div class="right-controls">
                        <div class="total-badge">Approved: Ksh ${parseFloat(row.dad_approved_total).toLocaleString()}</div>
                        <button class="btn-delete" onclick="deleteRecord('${row.id}')">🗑️</button>
                    </div>
                </div>
                <div>${itemsHtml}</div>
            `;
            target.appendChild(card);
        });
    }

    // New Intelligence Feature: Auto-Sorter Engine
    async function parseTextAndSave() {
        const textInput = document.getElementById('messy-input').value.trim();
        if (!textInput) return alert("Please paste the text response first!");

        const lines = textInput.split('\n');
        let parsedItems = [];
        let computedTotal = 0;

        lines.forEach((line, idx) => {
            // Check if line contains monetary amounts or tracking tags
            if (!line.includes('Ksh') && !line.includes('ksh')) return;

            // Extract item text prefix inside parent lines
            let name = line.replace(/[•\-\*]/g, '').split('(Ksh')[0].split('(ksh')[0].trim();
            
            // Extract money amount matching boundaries
            let amountMatch = line.match(/(?:Ksh|ksh)\s*([\d,.]+)/);
            let amount = amountMatch ? parseFloat(amountMatch[1].replace(/,/g, '')) : 0;
            
            // Map decisions via status checks
            let isApproved = line.includes('✅') || line.toLowerCase().includes('approved');
            let status = isApproved ? 'approve' : 'reject';

            if (name && !isNaN(amount)) {
                parsedItems.push({ id: idx, name: name, amount: amount, status: status });
                if (isApproved) computedTotal += amount;
            }
        });

        if (parsedItems.length === 0) {
            return alert("Could not detect any budget lines. Make sure the text includes 'Ksh' and status marks.");
        }

        // Upload processed sorting payload block right into Cloud storage logs 
        const { error } = await supabaseClient
            .from('budgets')
            .insert([{
                raw_list: textInput,
                items: parsedItems,
                dad_approved_total: computedTotal,
                is_reviewed: true,
                dad_reviewed_at: new Date().toISOString()
            }]);

        if (error) {
            alert("Database Error: Could not save parsed record.");
        } else {
            document.getElementById('messy-input').value = "";
            alert("⚡ Text sorted flawlessly and logged down in display cards below!");
            fetchRecords();
        }
    }

    async function deleteRecord(id) {
        if (!confirm("Are you sure you want to delete this specific review response?")) return;
        const { error } = await supabaseClient.from('budgets').delete().eq('id', id);
        if (error) alert("Database Error: Could not delete record.");
        else fetchRecords();
    }

    async function clearAllRecords() {
        if (!confirm("🚨 Delete ALL history logs permanently?")) return;
        const { error } = await supabaseClient.from('budgets').delete().eq('is_reviewed', true);
        if (error) alert("Database Error: Could not clear records.");
        else fetchRecords();
    }
</script>
</body>
</html>
